<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ផ្ទៀងផ្ទាត់ទិន្នន័យ (Verify)</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f4f6f8;
      color: #333;
      text-align: center;
    }
    .card {
      background: #ffffff;
      padding: 30px 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 85%;
      max-width: 350px;
    }
    .btn {
      background-color: #2481cc;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
      width: 100%;
    }
    .status {
      font-size: 14px;
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h3>🌐 ផ្ទៀងផ្ទាត់ទិន្នន័យ</h3>
    <p id="ip-text">កំពុងស្វែងរក IP Address...</p>
    <p id="device-text" class="status"></p>
    <button id="send-btn" class="btn" onclick="sendDataToBot()">ផ្ញើទៅកាន់ Bot & បិទ</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let collectedData = {
      ip: "Unknown",
      device: "Unknown"
    };

    function detectDevice() {
      const ua = navigator.userAgent;
      if (/android/i.test(ua)) return "Android Phone";
      if (/iPhone/i.test(ua)) return "iPhone";
      if (/iPad/i.test(ua)) return "iPad";
      if (/Windows/i.test(ua)) return "Windows PC";
      if (/Macintosh/i.test(ua)) return "Mac PC";
      if (/Linux/i.test(ua)) return "Linux PC";
      return "Browser/PC";
    }

    async function init() {
      collectedData.device = detectDevice();
      document.getElementById("device-text").innerText = "Device: " + collectedData.device;

      try {
        const res = await fetch("https://api64.ipify.org?format=json");
        const data = await res.json();
        collectedData.ip = data.ip || "Unknown";
        document.getElementById("ip-text").innerText = "IP: " + collectedData.ip;
      } catch (e) {
        document.getElementById("ip-text").innerText = "Could not fetch IP";
      }
    }

    function sendDataToBot() {
      // Sends data back to Python Bot
      tg.sendData(JSON.stringify(collectedData));
      tg.close();
    }

    window.onload = init;
  </script>
</body>
</html>
