<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ផ្ទៀងផ្ទាត់ទិន្នន័យ (Verify)</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: var(--tg-theme-bg-color, #f4f6f8);
      color: var(--tg-theme-text-color, #222);
      text-align: center;
    }
    .card {
      background: var(--tg-theme-secondary-bg-color, #ffffff);
      padding: 30px 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      width: 85%;
      max-width: 350px;
    }
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--tg-theme-button-color, #2481cc);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h3 { margin-top: 0; }
    p { color: var(--tg-theme-hint-color, #777); font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="loader" id="loader"></div>
    <h3 id="title">កំពុងដំណើរការ...</h3>
    <p id="desc">សូមរង់ចាំមួយភ្លែត Bot កំពុងកត់ត្រា IP និង Device</p>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function detectDevice() {
      const ua = navigator.userAgent;
      if (/android/i.test(ua)) return "Android Phone";
      if (/iPhone/i.test(ua)) return "iPhone";
      if (/iPad/i.test(ua)) return "iPad";
      if (/Windows/i.test(ua)) return "Windows PC";
      if (/Macintosh/i.test(ua)) return "Mac PC";
      if (/Linux/i.test(ua)) return "Linux PC";
      return "Unknown Device";
    }

    async function sendData() {
      let userIp = "Unknown";
      let userDevice = detectDevice();

      try {
        const res = await fetch("https://api64.ipify.org?format=json");
        const data = await res.json();
        userIp = data.ip || "Unknown";
      } catch (err) {
        console.error("IP Error:", err);
      }

      const payload = {
        ip: userIp,
        device: userDevice
      };

      // Send the IP and Device string back to your Telegram Bot
      tg.sendData(JSON.stringify(payload));
      
      // Close WebApp automatically
      tg.close();
    }

    window.onload = () => {
      setTimeout(sendData, 800);
    };
  </script>
</body>
</html>
